# --- H2 Database Configuration (In-Memory) ---
# Use H2 database
spring.datasource.url=jdbc:h2:mem:networkdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA Configuration ---
# This allows JPA to automatically create/update your tables (like network_packets)
spring.jpa.hibernate.ddl-auto=update
# Show SQL in the console for debugging
spring.jpa.show-sql=true

# --- H2 Console (Optional, but very useful) ---
# Enable the H2 web console
spring.h2.console.enabled=true
# Set the path to access the console (e.g., http://localhost:8080/h2-console)
spring.h2.console.path=/h2-console
