# --- Test Configuration ---
spring.datasource.url=jdbc:h2:file:./target/h2-database/mydb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console disabled in tests
spring.h2.console.enabled=false

# Admin credentials for tests
admin.username=testadmin
admin.password=testpass123

# Encryption
encryption.password=test-encryption-password-123!
keystore.path=test-keystore.p12
keystore.password=testkeystorepass
keystore.key.alias=test-key
keystore.type=PKCS12

# AbuseIPDB (dummy for tests)
abuseipdb.api.key=test-api-key-not-real

# Mail (disabled for tests)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
alert.admin.email=admin@test.com

# Disable mail auto-config for tests
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# --- Spring MVC Async Configuration ---
spring.mvc.async.request-timeout=300000
